# Propone actualizaciones de dependencias; la revisión automática (ci.yml) las prueba antes de fusionar.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    groups:
      # Las versiones menores y parches van juntos en un solo PR para no llenar la bandeja.
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
