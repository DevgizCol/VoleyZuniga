# Avisos automáticos de dependencias: un PR semanal agrupado (menos ruido) y PR inmediatos de seguridad.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    ignore:
      # Los tipos de Node deben coincidir con la versión que usa la web (Node 22 en CI y Vercel).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
