name: Revisión

# Se ejecuta en cada PR y en cada cambio a main: si algo falla, GitHub lo marca en rojo antes de fusionar.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencias vulnerables (producción)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit
      - name: Pruebas
        run: npm test
      - name: Compilar
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
